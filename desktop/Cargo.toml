[workspace]
members = ["vision"]
resolver = "2"

[package]
name = "jumpbot-desktop"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "jumpbot-desktop"

[features]
default = ["cuda", "opencl"]
cuda = []
opencl = []

[dependencies]
jumpbot-vision = {path = "vision"}
tempfile = "3"
windows-sys = {version = "0.61", features=["Win32_Foundation","Win32_Security","Win32_System_Threading","Win32_System_Console","Win32_Graphics_Gdi","Win32_Graphics_Dwm","Win32_Storage_Xps","Win32_UI_HiDpi","Win32_UI_Input_KeyboardAndMouse","Win32_UI_WindowsAndMessaging"]}
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
regex = "1"
crc32fast = "1"
libloading = "0.8"
clap = { version = "4", features = ["derive"] }
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
glob = "0.3"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
