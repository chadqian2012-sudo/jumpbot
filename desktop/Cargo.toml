[workspace]
members = ["vision"]
resolver = "2"

[package]
name = "jumpbot-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }

[profile.release]
lto = "thin"
