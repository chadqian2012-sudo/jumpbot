<!doctype html>
<html lang="zh-CN" data-ef-accent="amber" data-ef-paper="warm" data-ef-cut="wide"
      data-ef-ground="grid" data-ef-density="standard" data-ef-motion="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跳一跳控制台</title>
  <link rel="stylesheet" href="endfield.css">
  <link rel="stylesheet" href="console.css">
  <script defer src="console.js"></script>
</head>
<body class="ef">
  <div class="ef-tri ef-in-sweep" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="ef-cmdbar">
    <div class="brand"><span class="seal" aria-hidden="true">J</span> JUMPBOT</div>
    <div class="current">运行控制</div>
    <button class="theme" id="theme" type="button" aria-pressed="false">深色模式</button>
  </header>

  <main>
    <header class="mast">
      <div>
        <p class="ef-eyebrow slash">Jump console</p>
        <h1>跳一跳控制台</h1>
      </div>
      <div class="mast-meta"><span>Windows</span><span id="shortcuts">Alt+P 暂停 / F8 停止</span></div>
    </header>

    <p class="ef-notice" id="notice" data-flag="提示" role="status" hidden></p>

    <div class="overview">
      <section class="flight ef-in-power" aria-labelledby="flight-title">
        <div class="flight-copy">
          <h2 class="ef-pair" id="flight-title"><span class="ef-eyebrow slash">Run status</span><span>当前状态</span></h2>
          <span class="ef-state is-draft" id="phase" role="status">待机</span>
          <p id="phase-note">启动后会等待你手动打开小游戏。</p>
        </div>
        <svg class="diagram" viewBox="0 0 720 290" role="img" aria-label="跳跃示意图">
          <defs>
            <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
              <path d="M 22 0 H 0 V 22" fill="none" stroke="currentColor" stroke-opacity=".15"/>
            </pattern>
            <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <line y2="7" stroke="currentColor" stroke-opacity=".28" stroke-width="2"/>
            </pattern>
          </defs>
          <rect class="grid-fill" x="16" y="12" width="688" height="263" fill="url(#grid)"/>
          <path class="frame-edge" d="M16 52V12H54 M665 12H704V52 M704 236V275H665 M54 275H16V236" />
          <path class="base-line" d="M70 252H650"/>
          <g class="platform origin">
            <path d="M104 207 202 163 300 207 202 250Z"/>
            <path d="M104 207 202 250 300 207V230L202 273 104 230Z" fill="url(#hatch)"/>
            <path d="M202 250v23"/>
          </g>
          <g class="platform target">
            <path d="M421 152 519 108 617 152 519 196Z"/>
            <path d="M421 152 519 196 617 152V175L519 219 421 175Z" fill="url(#hatch)"/>
            <path d="M519 196v23"/>
            <path class="receiver" d="M503 153 519 146 535 153 519 160Z"/>
          </g>
          <path class="arc-guide" d="M202 207Q336 -62 519 153" pathLength="1"/>
          <path class="arc-sweep" d="M202 207Q336 -62 519 153" pathLength="1"/>
          <g class="pawn">
            <circle cx="202" cy="157" r="10"/>
            <path d="M194 173h16l8 28-16 7-16-7Z"/>
          </g>
          <g class="landing-mark"><path d="M484 153 519 137 554 153 519 169Z"/><path d="M474 153 519 132 564 153 519 174Z"/></g>
        </svg>
        <div class="flight-foot"><span>跳跃示意</span><b id="countdown" aria-live="off">—</b><span id="window">窗口未连接</span></div>
      </section>

      <section class="readouts ef-in-power" aria-labelledby="readout-title">
        <h2 class="ef-pair" id="readout-title"><span class="ef-eyebrow slash">Live metrics</span><span>本轮读数</span></h2>
        <div class="score">
          <span>当前分数</span><strong id="score">—</strong>
        </div>
        <dl class="metrics">
          <div><dt>跳跃次数</dt><dd id="jumps">—</dd></div>
          <div><dt>中心命中</dt><dd id="hit">—</dd></div>
          <div><dt>落地率</dt><dd id="land">—</dd></div>
          <div><dt>有效运行</dt><dd id="elapsed">—</dd></div>
        </dl>
        <div class="backend"><span>识别后端</span><b id="actual-backend">—</b><span>背景取样</span><b id="kernel">—</b></div>
      </section>
    </div>

    <div class="work">
      <section class="controls ef-in-power" aria-labelledby="controls-title">
        <h2 class="ef-pair" id="controls-title"><span class="ef-eyebrow slash">Controls</span><span>运行设置</span></h2>
        <div class="settings">
          <label for="backend">识别后端</label>
          <select id="backend">
            <option value="auto">自动选择</option>
            <option value="simd">CPU SIMD</option>
            <option value="cpu">CPU</option>
            <option value="cuda">CUDA</option>
            <option value="opencl">OpenCL</option>
          </select>
          <label class="repeat"><input class="ef-switch" id="daemon" type="checkbox"> 窗口重新打开后继续</label>
        </div>
        <div class="actions">
          <button type="button" class="ef-btn go" id="primary" disabled>启动脚本</button>
          <button type="button" class="ef-btn" id="stop" disabled>停止</button>
          <button type="button" class="ef-btn" id="check" disabled>无输入自检</button>
        </div>
      </section>
      <section class="activity ef-in-power" aria-labelledby="activity-title">
        <h2 class="ef-pair" id="activity-title"><span class="ef-eyebrow slash">Activity</span><span>运行日志</span></h2>
        <p class="empty" id="empty">启动或自检后，这里会显示运行日志。</p>
        <ol class="ledger" id="ledger" aria-label="最近运行日志" tabindex="0" hidden></ol>
      </section>
    </div>
  </main>
</body>
</html>
