name: Windows Rust packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      JUMPBOT_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Locate LLVM and the pinned OpenCV SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'opencv-4.14.0-windows.exe'
          Invoke-WebRequest 'https://github.com/opencv/opencv/releases/download/4.14.0/opencv-4.14.0-windows.exe' -OutFile $sdk
          if ((Get-FileHash $sdk).Hash -ne '5f266a8b73bed535962d7e861a6457e32a0dd5f463ad0a7cf8707a135469be63') { throw 'OpenCV SDK checksum mismatch' }
          & 7z x $sdk "-o$env:RUNNER_TEMP\cv" -y -bso0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = Join-Path $env:RUNNER_TEMP 'cv\opencv\build'
          $lib = Get-ChildItem "$root\x64\vc*\lib\opencv_world*.lib" | Where-Object BaseName -Match '^opencv_world\d+$' | Select-Object -First 1
          if (!$lib) { throw 'OpenCV release import library missing' }
          $clang = (Get-Command clang.exe -ErrorAction Stop).Source
          @("JUMPBOT_OPENCV_DIR=$root", "OPENCV_INCLUDE_PATHS=$root\include", "OPENCV_LINK_LIBS=$($lib.BaseName)", "OPENCV_LINK_PATHS=$($lib.DirectoryName)", "LIBCLANG_PATH=$(Split-Path $clang)") >> $env:GITHUB_ENV
      - name: Test the accelerated Rust build
        run: cargo test --manifest-path desktop/Cargo.toml --workspace --release --locked
      - name: Test the CPU-only Rust build
        run: cargo test --manifest-path desktop/Cargo.toml --workspace --release --locked --no-default-features
      - name: Build installers and ZIPs from the same payload
        run: cargo run --manifest-path desktop/Cargo.toml --locked -p jumpbot-dist -- --version 0.0.0-ci --candidate --output build/ci-package
      - name: Verify ZIP contents, installer upgrade and native desktop controls
        env:
          JUMPBOT_TEST_GUI: '1'
        run: cargo run --manifest-path desktop/Cargo.toml --locked -p jumpbot-dist -- --version 0.0.0-ci --output build/ci-package --verify --install
