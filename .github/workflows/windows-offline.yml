name: Windows Rust packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      JUMPBOT_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Locate LLVM and the pinned OpenCV SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP 'opencv-4.14.0-windows.exe'
          Invoke-WebRequest 'https://github.com/opencv/opencv/releases/download/4.14.0/opencv-4.14.0-windows.exe' -OutFile $sdk
          if ((Get-FileHash $sdk).Hash -ne '5f266a8b73bed535962d7e861a6457e32a0dd5f463ad0a7cf8707a135469be63') { throw 'OpenCV SDK checksum mismatch' }
          & 7z x $sdk "-o$env:RUNNER_TEMP\cv" -y -bso0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = Join-Path $env:RUNNER_TEMP 'cv\opencv\build'
          $lib = Get-ChildItem "$root\x64\vc*\lib\opencv_world*.lib" | Where-Object BaseName -Match '^opencv_world\d+$' | Select-Object -First 1
          if (!$lib) { throw 'OpenCV release import library missing' }
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm-22.1.8'
          $archive = Join-Path $env:RUNNER_TEMP 'LLVM-22.1.8-win64.exe'
          Invoke-WebRequest 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c') { throw 'LLVM checksum mismatch' }
          & 7z x $archive "-o$llvm" -y -bso0 'bin/clang.exe' 'bin/libclang.dll' 'lib/clang/22/include/*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $clang = Join-Path $llvm 'bin/clang.exe'
          & $clang --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Split-Path $clang) >> $env:GITHUB_PATH
          @("JUMPBOT_OPENCV_DIR=$root", "OPENCV_INCLUDE_PATHS=$root\include", "OPENCV_LINK_LIBS=$($lib.BaseName)", "OPENCV_LINK_PATHS=$($lib.DirectoryName)", "LIBCLANG_PATH=$(Split-Path $clang)") >> $env:GITHUB_ENV
      - name: Test the accelerated Rust build
        run: cargo test --manifest-path desktop/Cargo.toml --workspace --release --locked
      - name: Verify foreground screen pixels, hit routing and SendInput delivery
        env:
          JUMPBOT_TEST_FOREGROUND: '1'
          JUMPBOT_TEST_SENDINPUT: '1'
          JUMPBOT_NO_INPUT: '0'
        timeout-minutes: 5
        run: |
          cargo test --manifest-path desktop/Cargo.toml --locked --release -p jumpbot-desktop --lib platform::tests::foreground_overlay_capture -- --exact --ignored --nocapture | Tee-Object -Variable result
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!($result -match '^test result: ok\. 1 passed;')) { throw 'Foreground acceptance did not execute exactly one test' }
          foreach ($case in 'click-through', 'covered', 'all-covered', 'foreground-lost') {
            if (!($result -match "SendInput ${case}:")) { throw "Missing delivery receipts for $case" }
          }
      - name: Test the CPU-only Rust build
        run: cargo test --manifest-path desktop/Cargo.toml --workspace --release --locked --no-default-features
      - name: Build installers and ZIPs from the same payload
        run: cargo run --manifest-path desktop/Cargo.toml --locked -p jumpbot-dist -- --version 0.0.0-ci --candidate --output build/ci-package
      - name: Verify ZIP contents, installer upgrade and native desktop controls
        env:
          JUMPBOT_TEST_GUI: '1'
        run: cargo run --manifest-path desktop/Cargo.toml --locked -p jumpbot-dist -- --version 0.0.0-ci --output build/ci-package --verify --install
      - name: Install and verify each offline component selection
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo run --manifest-path desktop/Cargo.toml --locked -p jumpbot-dist -- --candidate --offline-installer --version 0.0.0-ci --output build/ci-offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --manifest-path desktop/Cargo.toml --locked -p jumpbot-dist -- --offline-installer --version 0.0.0-ci --output build/ci-offline --verify --install
